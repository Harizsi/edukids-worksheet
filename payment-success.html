<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran | EduKids Worksheet</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffdf8;color:#222;font-family:Arial,sans-serif}.card{width:min(620px,100%);background:#fff;border-radius:24px;padding:38px 28px;text-align:center;box-shadow:0 15px 45px #00000012;border:1px solid #eee}.icon{width:72px;height:72px;margin:auto auto 20px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#e9f8ef;color:#218838}h1{margin:0 0 12px;font-size:clamp(28px,6vw,40px)}p{color:#666;line-height:1.65}.status{margin:24px 0;padding:16px;border-radius:14px;background:#f7f7f7;text-align:left}.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #e8e8e8}.row:last-child{border:0}.row strong{text-align:right;overflow-wrap:anywhere}.btn{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:13px 22px;border-radius:10px;text-decoration:none;font-weight:700;background:#ff7043;color:#fff}.pending .icon{background:#fff5d8;color:#9a6a00}.failed .icon{background:#fdecec;color:#b42318}.note{font-size:13px}
</style></head><body><main class="card" id="card"><div class="icon" id="icon">✓</div><h1 id="title">Status pembayaran</h1><p id="message">Memproses status transaksi...</p><div class="status" id="statusBox"></div><a class="btn" href="/">Kembali ke EduKids Worksheet</a><p class="note">Pengesahan sebenar dibuat melalui callback ToyyibPay di server.</p></main>
<script>
(()=>{const p=new URLSearchParams(location.search),s=p.get("status_id")||"",b=p.get("billcode")||"",o=p.get("order_id")||"",card=document.querySelector("#card"),icon=document.querySelector("#icon"),title=document.querySelector("#title"),msg=document.querySelector("#message"),box=document.querySelector("#statusBox");
let label="Tidak diketahui";if(s==="1"){label="Pembayaran berjaya";title.textContent="Pembayaran berjaya";msg.textContent="Terima kasih. Pesanan anda telah dihantar untuk pengesahan pembayaran."}else if(s==="2"){label="Pembayaran sedang diproses";card.classList.add("pending");icon.textContent="…";title.textContent="Pembayaran sedang diproses";msg.textContent="Status transaksi masih belum muktamad."}else if(s==="3"){label="Pembayaran gagal";card.classList.add("failed");icon.textContent="!";title.textContent="Pembayaran tidak berjaya";msg.textContent="Transaksi tidak berjaya. Sila kembali dan cuba lagi."}else{icon.textContent="?";msg.textContent="Status pembayaran tidak lengkap."}
const esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));box.innerHTML=`<div class="row"><span>Status</span><strong>${esc(label)}</strong></div>${o?`<div class="row"><span>No. Pesanan</span><strong>${esc(o)}</strong></div>`:""}${b?`<div class="row"><span>Bill Code</span><strong>${esc(b)}</strong></div>`:""}`})()
</script></body></html>
